name: CI

on:
  push:
    branches: [main]
    tags: ['*/v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed by the version guard
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax check
        run: python -m py_compile tools/transcript.py tools/github-trending/fetch.py
      - name: Unit, structure and upstream-fidelity tests
        run: npm test
      - name: Bundled copies, generated provenance and version guard
        run: npm run check
